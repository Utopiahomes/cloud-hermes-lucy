services:
  hermes-profile-seed:
    image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        if [ ! -f /opt/data/.lucy-profile-seeded ]; then
          cp -R /seed/. /opt/data/ && touch /opt/data/.lucy-profile-seeded;
        fi;
        chown -R 10000:10000 /opt/data
    user: "0:0"
    volumes:
      - hermes-spike-data:/opt/data
      - ./profiles/lucy:/seed:ro
    networks:
      - lucy-private

  hermes-spike:
    image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    platform: linux/amd64
    command: ["--version"]
    environment:
      LUCY_COMPANION_URL: http://lucy-api:8080
    volumes:
      - hermes-spike-data:/opt/data
    depends_on:
      hermes-profile-seed:
        condition: service_completed_successfully
      lucy-api:
        condition: service_started
    networks:
      - lucy-private

volumes:
  hermes-spike-data:
