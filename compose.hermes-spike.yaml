services:
  hermes-profile-seed:
    image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        cp -R /seed/. /opt/data/ && touch /opt/data/.lucy-profile-seeded;
        chown -R 10000:10000 /opt/data
    user: "0:0"
    volumes:
      - hermes-spike-data:/opt/data
      - ./profiles/lucy:/seed:ro
    networks:
      - lucy-private

  hermes-spike:
    image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    platform: linux/amd64
    command: ["--version"]
    environment:
      LUCY_COMPANION_URL: http://lucy-api:8080
      LUCY_ADAPTER_TOKEN: ${LUCY_ADAPTER_TOKEN:?set LUCY_ADAPTER_TOKEN outside Git}
    volumes:
      - hermes-spike-data:/opt/data
    depends_on:
      hermes-profile-seed:
        condition: service_completed_successfully
      lucy-api:
        condition: service_healthy
    networks:
      - lucy-private

  hermes-openrouter-smoke:
    profiles: ["live-openrouter"]
    image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    platform: linux/amd64
    command:
      - --oneshot
      - Return exactly LUCY_HERMES_OPENROUTER_OK. Do not call tools.
      - --usage-file
      - /opt/data/openrouter-smoke-usage.json
      - --ignore-rules
      - --toolsets
      - clarify
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY outside Git}
      LUCY_COMPANION_URL: http://lucy-api:8080
      LUCY_ADAPTER_TOKEN: ${LUCY_ADAPTER_TOKEN:?set LUCY_ADAPTER_TOKEN outside Git}
    volumes:
      - hermes-spike-data:/opt/data
    depends_on:
      hermes-plugin-preflight:
        condition: service_completed_successfully
      lucy-api:
        condition: service_healthy
    networks:
      - lucy-private
    restart: "no"

  hermes-plugin-preflight:
    profiles: ["live-openrouter"]
    image: docker.io/nousresearch/hermes-agent:v2026.8.19@sha256:3811ed13da874fba2ac99b6d492db9a203d34cb6dccf90d886948c00d0ccec09
    platform: linux/amd64
    command: ["plugins", "doctor", "--ci", "lucy_control"]
    volumes:
      - hermes-spike-data:/opt/data
    depends_on:
      hermes-profile-seed:
        condition: service_completed_successfully
    networks:
      - lucy-private
    restart: "no"

volumes:
  hermes-spike-data:
