AWSTemplateFormatVersion: "2010-09-09"
Description: Cloud Lucy Security Baseline v1.1 - scoped Render OIDC identities

Parameters:
  RenderOidcProviderArn:
    Type: String
    Description: Existing IAM OIDC provider ARN for the Render workspace
  RenderWorkspaceId:
    Type: String
  RenderEnvironmentId:
    Type: String
  RenderArchiveServiceId:
    Type: String
  RenderEvidenceServiceId:
    Type: String
  RenderDeletionServiceId:
    Type: String
  DeletionJournalId:
    Type: String
    Description: Independently generated UUID for the append-only deletion journal
  ArchiveRegistryId:
    Type: String
    Description: Independently generated UUID bound to the wrapped-key registry
  AlertEmail:
    Type: String
  KeyAdministratorPrincipalArnPattern:
    Type: String
    Description: >-
      ArnLike pattern for the IAM Identity Center administrator role, ending in
      AWSReservedSSO_LucySecurityAdministrator_*
  ArchiveRoleName:
    Type: String
    Default: lucy-render-archive
  EvidenceRoleName:
    Type: String
    Default: lucy-render-evidence
  DeletionRoleName:
    Type: String
    Default: lucy-render-deletion

Resources:
  KmsRecoveryAdministratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lucy-kms-recovery-administrator
      MaxSessionDuration: 3600
      Description: Stable human-only recovery path for Lucy KMS key administration
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn: !Ref KeyAdministratorPrincipalArnPattern

  EvidenceKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Cloud Lucy per-record evidence DEK wrapping key
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: IdentityCenterHumanKeyAdministrator
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
            Condition:
              ArnLike:
                aws:PrincipalArn: !Ref KeyAdministratorPrincipalArnPattern
          - Sid: StableHumanRecoveryAdministrator
            Effect: Allow
            Principal:
              AWS: !GetAtt KmsRecoveryAdministratorRole.Arn
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
          - Sid: ArchiveGenerateOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt ArchiveRole.Arn
            Action: kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:EncryptionContext:application: cloud-hermes-lucy
              ForAllValues:StringEquals:
                kms:EncryptionContextKeys:
                  - application
                  - evidence-id
          - Sid: EvidenceDecryptOnly
            Effect: Allow
            Principal:
              AWS: !GetAtt EvidenceRole.Arn
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:EncryptionContext:application: cloud-hermes-lucy
              ForAllValues:StringEquals:
                kms:EncryptionContextKeys:
                  - application
                  - evidence-id

  EvidenceKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/cloud-lucy-evidence
      TargetKeyId: !Ref EvidenceKey

  WrappedKeyRegistry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lucy-wrapped-evidence-keys
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: key_ref
          AttributeType: S
      KeySchema:
        - AttributeName: key_ref
          KeyType: HASH

  DeletionJournalHead:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lucy-deletion-journal-head
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: journal_key
          AttributeType: S
      KeySchema:
        - AttributeName: journal_key
          KeyType: HASH

  DeletionJournalIntents:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: lucy-deletion-journal-intents
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: journal_id
          AttributeType: S
        - AttributeName: entry_key
          AttributeType: S
      KeySchema:
        - AttributeName: journal_id
          KeyType: HASH
        - AttributeName: entry_key
          KeyType: RANGE

  ArchiveRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ArchiveRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${Provider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"oidc.render.com/${Workspace}:aud":"sts.amazonaws.com","oidc.render.com/${Workspace}:sub":"workspace:${Workspace}:environment:${Environment}:service:${Service}"}}}]}
        - Provider: !Ref RenderOidcProviderArn
          Workspace: !Ref RenderWorkspaceId
          Environment: !Ref RenderEnvironmentId
          Service: !Ref RenderArchiveServiceId

  # Attach permissions after the roles and key exist. Inline policies here
  # would create a cycle when the key policy references the role principals.
  ArchivePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lucy-archive-only
      Roles: [!Ref ArchiveRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: kms:GenerateDataKey
            Resource: !GetAtt EvidenceKey.Arn
            Condition:
              StringEquals:
                kms:EncryptionContext:application: cloud-hermes-lucy
              ForAllValues:StringEquals:
                kms:EncryptionContextKeys:
                  - application
                  - evidence-id
          - Effect: Allow
            Action: dynamodb:PutItem
            Resource: !GetAtt WrappedKeyRegistry.Arn
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt DeletionJournalHead.Arn
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys:
                  - HEAD
                dynamodb:Attributes:
                  - journal_key
                  - journal_id
                  - registry_id
                  - sequence
                  - digest

  EvidenceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref EvidenceRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${Provider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"oidc.render.com/${Workspace}:aud":"sts.amazonaws.com","oidc.render.com/${Workspace}:sub":"workspace:${Workspace}:environment:${Environment}:service:${Service}"}}}]}
        - Provider: !Ref RenderOidcProviderArn
          Workspace: !Ref RenderWorkspaceId
          Environment: !Ref RenderEnvironmentId
          Service: !Ref RenderEvidenceServiceId

  EvidencePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: lucy-evidence-only
      Roles: [!Ref EvidenceRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: kms:Decrypt
            Resource: !GetAtt EvidenceKey.Arn
            Condition:
              StringEquals:
                kms:EncryptionContext:application: cloud-hermes-lucy
              ForAllValues:StringEquals:
                kms:EncryptionContextKeys:
                  - application
                  - evidence-id
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt WrappedKeyRegistry.Arn
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt DeletionJournalHead.Arn
            Condition:
              ForAllValues:StringEquals:
                dynamodb:LeadingKeys:
                  - HEAD
                dynamodb:Attributes:
                  - journal_key
                  - journal_id
                  - registry_id
                  - sequence
                  - digest

  DeletionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeletionRoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${Provider}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"oidc.render.com/${Workspace}:aud":"sts.amazonaws.com","oidc.render.com/${Workspace}:sub":"workspace:${Workspace}:environment:${Environment}:service:${Service}"}}}]}
        - Provider: !Ref RenderOidcProviderArn
          Workspace: !Ref RenderWorkspaceId
          Environment: !Ref RenderEnvironmentId
          Service: !Ref RenderDeletionServiceId
      Policies:
        - PolicyName: lucy-delete-individual-keys-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt WrappedKeyRegistry.Arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - !GetAtt DeletionJournalHead.Arn
                  - !GetAtt DeletionJournalIntents.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt DeletionJournalHead.Arn
                Condition:
                  ForAnyValue:StringEquals:
                    dynamodb:EnclosingOperation: TransactWriteItems
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt DeletionJournalIntents.Arn
                Condition:
                  ForAnyValue:StringEquals:
                    dynamodb:EnclosingOperation: TransactWriteItems

  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/lucy-security-audit
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AuditBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/lucy-security-audit

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: AuditBucketPolicy
    Properties:
      TrailName: lucy-security-audit
      S3BucketName: !Ref AuditBucket
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false
      IsLogging: true
      EnableLogFileValidation: true
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
          DataResources:
            - Type: AWS::DynamoDB::Table
              Values:
                - !GetAtt WrappedKeyRegistry.Arn
                - !GetAtt DeletionJournalHead.Arn
                - !GetAtt DeletionJournalIntents.Arn

  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: lucy-security-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  SecurityAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref SecurityAlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SecurityAlertTopic

  KeyAdministrationAlert:
    Type: AWS::Events::Rule
    Properties:
      Description: Alert on changes capable of disabling Lucy evidence decryption
      EventPattern:
        source: [aws.kms]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [kms.amazonaws.com]
          eventName:
            - DisableKey
            - ScheduleKeyDeletion
            - PutKeyPolicy
            - DeleteAlias
      State: ENABLED
      Targets:
        - Arn: !Ref SecurityAlertTopic
          Id: lucy-kms-owner-alert

Outputs:
  EvidenceKeyArn:
    Value: !GetAtt EvidenceKey.Arn
  WrappedKeyTableName:
    Value: !Ref WrappedKeyRegistry
  DeletionJournalHeadTableName:
    Value: !Ref DeletionJournalHead
  DeletionJournalIntentTableName:
    Value: !Ref DeletionJournalIntents
  DeletionJournalId:
    Value: !Ref DeletionJournalId
  ArchiveRegistryId:
    Value: !Ref ArchiveRegistryId
  ArchiveRoleArn:
    Value: !GetAtt ArchiveRole.Arn
  EvidenceRoleArn:
    Value: !GetAtt EvidenceRole.Arn
  DeletionRoleArn:
    Value: !GetAtt DeletionRole.Arn
  KmsRecoveryAdministratorRoleArn:
    Value: !GetAtt KmsRecoveryAdministratorRole.Arn
