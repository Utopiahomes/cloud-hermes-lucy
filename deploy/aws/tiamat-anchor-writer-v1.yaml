AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Tiamat v1 M4 validating sole writer for the external recovery anchor. The writer function's
  role is the only principal granted PutItem on the anchor table, and the table's own resource
  policy (tiamat-recovery-anchor-v1) denies item writes to everyone else. A CloudTrail trail
  delivered to CloudWatch Logs alarms on any item write by another principal and on any change
  to the table's boundary, the writer function or the writer role.

Parameters:
  ResourceNamespace:
    Type: String
    AllowedPattern: "[a-z0-9-]{3,32}"
  EnvironmentName:
    Type: String
    AllowedPattern: "[a-z0-9-]{2,32}"
  AnchorTableName:
    Type: String
    AllowedPattern: "[A-Za-z0-9_.-]{3,255}"
    Description: RecoveryAnchorTableName output of the tiamat-recovery-anchor-v1 stack
  CoordinatorRoleName:
    Type: String
    AllowedPattern: "[A-Za-z0-9+=,.@_-]{1,64}"
    Description: Existing recovery-coordinator role; receives invoke permission only
  WriterArtifactBucket:
    Type: String
    AllowedPattern: "[a-z0-9.-]{3,63}"
  WriterArtifactKey:
    Type: String
    AllowedPattern: "[A-Za-z0-9!_.*'()/-]{1,1024}"
  WriterArtifactObjectVersion:
    Type: String
    AllowedPattern: "[A-Za-z0-9._-]{1,1024}"
  WriterArtifactCodeSha256:
    Type: String
    AllowedPattern: "[A-Za-z0-9+/=]{44}"
    Description: Base64 SHA-256 of the artifact; recorded with every published version
  WriterRootsJson:
    Type: String
    MinLength: 2
    Description: >-
      JSON object mapping each anchor key to the root the writer trusts for it. Changing it is a
      reviewed change: it decides which signed transitions may ever be installed.
  WriterRootsSha256:
    Type: String
    AllowedPattern: "[0-9a-f]{64}"
    Description: >-
      Hex SHA-256 of the exact WriterRootsJson bytes. It is part of the published version, so a
      root change always publishes a new version for the live alias, and the writer refuses to
      start if its configuration does not hash to it.
  AlarmTopicArn:
    Type: String
    AllowedPattern: "arn:aws[a-z-]*:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]{1,256}"
    Description: Existing SNS topic that accepts CloudWatch alarm notifications

Resources:
  WriterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writer-v1
      RetentionInDays: 365

  WriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writer-v1
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
              ArnLike:
                "aws:SourceArn": !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writer-v1*
      Tags:
        - {Key: stoin:system, Value: tiamat}
        - {Key: stoin:purpose, Value: recovery-anchor-writer}
        - {Key: stoin:environment, Value: !Ref EnvironmentName}

  WriterPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ResourceNamespace}-${EnvironmentName}-anchor-writer-v1
      Roles: [!Ref WriterRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StrongReadAndConditionalWriteOnly
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnchorTableName}
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [!Sub "ENV#${EnvironmentName}#LEDGER#*"]
              "Null": {"dynamodb:LeadingKeys": "false"}
          - Sid: WriteOwnLogsOnly
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub ${WriterLogGroup.Arn}:*

  WriterFunction:
    Type: AWS::Lambda::Function
    DependsOn: [WriterPolicy, WriterLogGroup]
    Properties:
      FunctionName: !Sub ${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writer-v1
      Description: Validating sole writer of the Tiamat recovery anchor (M4)
      Runtime: python3.12
      RuntimeManagementConfig: {UpdateRuntimeOn: Auto}
      Architectures: [x86_64]
      Handler: lucy.shared_execution.anchor_writer_lambda.handler
      Role: !GetAtt WriterRole.Arn
      Timeout: 15
      MemorySize: 256
      # One install at a time. The conditional write already makes concurrent installs safe; this
      # also keeps the writer's own reread and response unambiguous.
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref WriterArtifactBucket
        S3Key: !Ref WriterArtifactKey
        S3ObjectVersion: !Ref WriterArtifactObjectVersion
      Environment:
        Variables:
          TIAMAT_RECOVERY_ANCHOR_TABLE: !Ref AnchorTableName
          TIAMAT_ANCHOR_WRITER_ROOTS: !Ref WriterRootsJson
          TIAMAT_ANCHOR_WRITER_ROOTS_SHA256: !Ref WriterRootsSha256

  WriterVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref WriterFunction
      CodeSha256: !Ref WriterArtifactCodeSha256
      # A version snapshots code and configuration. Naming both digests here makes either change
      # replace this resource, so a new version is published and the live alias moves to it.
      Description: !Sub Tiamat anchor writer code-${WriterArtifactCodeSha256} roots-${WriterRootsSha256}

  WriterAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref WriterFunction
      FunctionVersion: !GetAtt WriterVersion.Version
      Name: live

  CoordinatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WriterAlias
      Principal: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${CoordinatorRoleName}

  CoordinatorInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ResourceNamespace}-${EnvironmentName}-anchor-writer-invoke-v1
      Roles: [!Ref CoordinatorRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeTheAnchorWriterOnly
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Ref WriterAlias

  AnchorWriteTrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      VersioningConfiguration: {Status: Enabled}

  AnchorWriteTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AnchorWriteTrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt AnchorWriteTrailBucket.Arn
            Condition:
              StringEquals:
                "aws:SourceArn": !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writes-v1
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub ${AnchorWriteTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                "aws:SourceArn": !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writes-v1
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AnchorWriteTrailBucket.Arn
              - !Sub ${AnchorWriteTrailBucket.Arn}/*
            Condition:
              Bool: {"aws:SecureTransport": "false"}

  AnchorTrailLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /stoin/${ResourceNamespace}-${EnvironmentName}/tiamat-anchor-writes-v1
      RetentionInDays: 365

  AnchorTrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}
      Policies:
        - PolicyName: deliver-anchor-trail-to-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${AnchorTrailLogGroup.Arn}:*

  AnchorWriteTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: [AnchorWriteTrailBucketPolicy]
    Properties:
      TrailName: !Sub ${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writes-v1
      S3BucketName: !Ref AnchorWriteTrailBucket
      CloudWatchLogsLogGroupArn: !GetAtt AnchorTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt AnchorTrailLogsRole.Arn
      IsLogging: true
      IsMultiRegionTrail: false
      # IAM is a global service; its events reach a trail only with this set.
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      AdvancedEventSelectors:
        - Name: Every item write to the recovery anchor table
          FieldSelectors:
            - {Field: eventCategory, Equals: [Data]}
            - {Field: resources.type, Equals: ["AWS::DynamoDB::Table"]}
            - Field: resources.ARN
              Equals:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnchorTableName}
            - {Field: readOnly, Equals: ["false"]}
        - Name: Every management write, for boundary changes
          FieldSelectors:
            - {Field: eventCategory, Equals: [Management]}
            - {Field: readOnly, Equals: ["false"]}

  ForeignItemWriteByRoleFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnchorTrailLogGroup
      FilterPattern: !Sub '{ ($.eventCategory = "Data") && ($.eventSource = "dynamodb.amazonaws.com") && ($.readOnly IS FALSE) && ($.resources[*].ARN = "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnchorTableName}") && ($.userIdentity.type = "AssumedRole") && ($.userIdentity.sessionContext.sessionIssuer.arn != "${WriterRole.Arn}") }'
      MetricTransformations:
        - {MetricNamespace: Stoin/TiamatAnchor, MetricName: ForeignAnchorWrites, MetricValue: "1"}

  ForeignItemWriteByNonRoleFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnchorTrailLogGroup
      # An IAM user or root carries no session issuer, so it is caught by identity type.
      FilterPattern: !Sub '{ ($.eventCategory = "Data") && ($.eventSource = "dynamodb.amazonaws.com") && ($.readOnly IS FALSE) && ($.resources[*].ARN = "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnchorTableName}") && ($.userIdentity.type != "AssumedRole") }'
      MetricTransformations:
        - {MetricNamespace: Stoin/TiamatAnchor, MetricName: ForeignAnchorWrites, MetricValue: "1"}

  BoundaryChangeFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AnchorTrailLogGroup
      # The table's policy, protection or existence; the writer function's code, configuration,
      # alias or permissions (which hold its pinned roots); and the writer role's policies.
      FilterPattern: !Sub '{ ($.eventCategory = "Management") && ($.readOnly IS FALSE) && ((($.eventSource = "dynamodb.amazonaws.com") && (($.requestParameters.tableName = "${AnchorTableName}") || ($.requestParameters.resourceArn = "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AnchorTableName}"))) || (($.eventSource = "lambda.amazonaws.com") && ($.requestParameters.functionName = "*${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-writer-v1*")) || (($.eventSource = "iam.amazonaws.com") && ($.requestParameters.roleName = "${WriterRole}"))) }'
      MetricTransformations:
        - {MetricNamespace: Stoin/TiamatAnchor, MetricName: AnchorBoundaryChanges, MetricValue: "1"}

  ForeignAnchorWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourceNamespace}-${EnvironmentName}-tiamat-foreign-anchor-write-v1
      AlarmDescription: An anchor-table item write by a principal other than the M4 writer role
      Namespace: Stoin/TiamatAnchor
      MetricName: ForeignAnchorWrites
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  AnchorBoundaryChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ResourceNamespace}-${EnvironmentName}-tiamat-anchor-boundary-change-v1
      AlarmDescription: A change to the anchor table's boundary, the writer function or its role
      Namespace: Stoin/TiamatAnchor
      MetricName: AnchorBoundaryChanges
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

Outputs:
  WriterFunctionAliasArn:
    Value: !Ref WriterAlias
  WriterRoleArn:
    Value: !GetAtt WriterRole.Arn
  WriterCodeSha256:
    Value: !Ref WriterArtifactCodeSha256
