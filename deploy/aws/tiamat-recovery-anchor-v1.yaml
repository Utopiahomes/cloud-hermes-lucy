AWSTemplateFormatVersion: "2010-09-09"
Description: Tiamat v1 external signed recovery-anchor authority

Parameters:
  ResourceNamespace:
    Type: String
    AllowedPattern: "[a-z0-9-]{3,32}"
  EnvironmentName:
    Type: String
    AllowedPattern: "[a-z0-9-]{2,32}"
  AnchorReaderRoleName:
    Type: String
    AllowedPattern: "[A-Za-z0-9+=,.@_-]{1,64}"
    Description: Existing Tiamat runtime role; receives strongly consistent read access only
  AnchorUpdaterRoleName:
    Type: String
    AllowedPattern: "[A-Za-z0-9+=,.@_-]{1,64}"
    Description: >-
      Existing recovery-coordinator role; receives strong-read access only. Writes go through the
      M4 anchor writer (tiamat-anchor-writer-v1), whose role is the only PutItem principal.
  AnchorWriterRoleName:
    Type: String
    AllowedPattern: "[A-Za-z0-9+=,.@_-]{1,64}"
    Description: >-
      WriterRoleArn role name from the tiamat-anchor-writer-v1 stack. The table's own resource
      policy denies every item write to every other principal. Deploy the writer stack first.

Resources:
  RecoveryAnchorTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ResourceNamespace}-${EnvironmentName}-tiamat-recovery-anchor-v1
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 35
      AttributeDefinitions:
        - AttributeName: anchor_key
          AttributeType: S
      KeySchema:
        - AttributeName: anchor_key
          KeyType: HASH
      # M4 enforced at the table, not only reported: no principal but the writer's role may
      # write an item, by any API. Removing this is a management event the writer stack alarms on.
      ResourcePolicy:
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: OnlyTheAnchorWriterWritesItems
              Effect: Deny
              Principal: "*"
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
                - dynamodb:PartiQLInsert
                - dynamodb:PartiQLUpdate
                - dynamodb:PartiQLDelete
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ResourceNamespace}-${EnvironmentName}-tiamat-recovery-anchor-v1
              Condition:
                ArnNotEquals:
                  "aws:PrincipalArn": !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AnchorWriterRoleName}
      Tags:
        - {Key: stoin:system, Value: tiamat}
        - {Key: stoin:purpose, Value: recovery-authority}
        - {Key: stoin:environment, Value: !Ref EnvironmentName}

  RecoveryAnchorReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ResourceNamespace}-${EnvironmentName}-anchor-read-v1
      Roles: [!Ref AnchorReaderRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadExactRecoveryAnchorOnly
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt RecoveryAnchorTable.Arn
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [!Sub "ENV#${EnvironmentName}#LEDGER#*"]
              "Null": {"dynamodb:LeadingKeys": "false"}
          - Sid: DescribeRecoveryAnchorTable
            Effect: Allow
            Action: dynamodb:DescribeTable
            Resource: !GetAtt RecoveryAnchorTable.Arn

  RecoveryAnchorUpdatePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ResourceNamespace}-${EnvironmentName}-anchor-update-v1
      Roles: [!Ref AnchorUpdaterRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # M4: the coordinator no longer holds PutItem. It reads the head and asks the writer.
          - Sid: StrongReadRecoveryAnchorOnly
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt RecoveryAnchorTable.Arn
            Condition:
              ForAllValues:StringLike:
                dynamodb:LeadingKeys: [!Sub "ENV#${EnvironmentName}#LEDGER#*"]
              "Null": {"dynamodb:LeadingKeys": "false"}
          - Sid: DescribeRecoveryAnchorTable
            Effect: Allow
            Action: dynamodb:DescribeTable
            Resource: !GetAtt RecoveryAnchorTable.Arn

Outputs:
  RecoveryAnchorTableName:
    Value: !Ref RecoveryAnchorTable
  RecoveryAnchorTableArn:
    Value: !GetAtt RecoveryAnchorTable.Arn
  RecoveryAnchorRegion:
    Value: !Ref AWS::Region
