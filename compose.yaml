name: cloud-hermes-lucy

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lucy}
      POSTGRES_USER: ${POSTGRES_USER:-lucy_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - lucy-postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:54320:5432"
    networks:
      - lucy-private
    restart: unless-stopped

  lucy-api:
    build:
      context: .
      target: runtime
    environment:
      LUCY_DATABASE_URL: ${LUCY_DATABASE_URL:?set LUCY_DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lucy-private
    restart: unless-stopped

networks:
  lucy-private:
    # Project-scoped bridge for local development. PostgreSQL is published only
    # on loopback; production uses an internal network and in-network migrations.
    driver: bridge

volumes:
  lucy-postgres:
